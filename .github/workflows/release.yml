name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:

          - os: macos-14
            target: aarch64-apple-darwin
            engine_name: neurocursor-engine-aarch64-apple-darwin
            bin_ext: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            engine_name: neurocursor-engine-x86_64-pc-windows-msvc.exe
            bin_ext: ".exe"

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Engine Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[desktop]"
          pip install pyinstaller
        working-directory: desktop/engine

      - name: Build Engine
        run: python -m PyInstaller neurocursor-engine.spec --clean
        working-directory: desktop/engine

      - name: Move Engine Binary
        run: |
          mkdir -p ../app/src-tauri/bin
          cp dist/neurocursor-engine${{ matrix.bin_ext }} ../app/src-tauri/bin/${{ matrix.engine_name }}
        working-directory: desktop/engine
        shell: bash

      - name: Install Frontend Dependencies
        run: npm install
        working-directory: desktop/app

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop/app
          args: --target ${{ matrix.target }}
          tagName: v1.0.3
          releaseName: 'NeuroCursor v1.0.3'
          releaseBody: 'Download the latest version of NeuroCursor for your platform below.'
          releaseDraft: false
          prerelease: false
